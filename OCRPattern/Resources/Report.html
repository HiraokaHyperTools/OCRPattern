<!doctype html>
<html>

<head>

</head>

<body>
  <table border="1">
    <caption>{{TableTitle}}</caption>
    <thead>
      <tr>
        {{#each Columns}}
        <th nowrap="nowrap">{{this}}</th>
        {{/each}}
      </tr>
    </thead>
    <tbody>
      {{#each Rows}}
      <tr>
        {{#each this}}
        {{#if pre}}
        <td nowrap="nowrap"><pre>{{text}}</pre></td>
        {{#else}}
        <td nowrap="nowrap">{{text}}</td>
        {{/if}}
        {{/each}}
      </tr>
      {{/each}}
    </tbody>
  </table>

  <p>全体の画像：</p>
  <img src="pic.jpg" style="width: 80%;" />

  <p>文字認識で使用した画像：</p>
  <div>
    {{#each Results}}
    <table border="1" cellpadding="5" cellspacing="1" style="margin-right: 1em; margin-bottom: 1em;">
      <caption>{{number}} の画像</caption>
      <thead>
        <tr>
          <th>画像</th>
          <th>認識結果</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <img src="{{imgsrc}}" style="border: solid 2px blue; float: left; " />
          </td>
          <td>
            <pre>{{text}}</pre>
          </td>
        </tr>
      </tbody>
    </table>
    {{/each}}
  </div>

  <p>OCR エンジン:</p>
  <pre>{{OcrEngines}}</pre>

  <p>ImageMagick:</p>
  <pre>{{Magicks}}</pre>

</body>

</html>
